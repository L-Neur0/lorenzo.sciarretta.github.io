  <style>
    /* Writing page specific overrides */
    .writing-content { padding: 4rem 0 8rem; }
    
    .notes-hero { margin-bottom: 4rem; }
    .notes-hero h1 { 
      font-size: clamp(2.5rem, 6vw, 4rem); 
      font-weight: 800; 
      letter-spacing: -0.04em; 
      margin-bottom: 1.5rem;
    }
    .notes-hero p { 
      font-size: 1.25rem; 
      color: var(--fg-muted); 
      max-width: 32ch;
      line-height: 1.4;
    }

    .section-header { 
      display: flex; 
      align-items: center; 
      gap: 2rem; 
      margin: 4rem 0 2rem; 
    }
    .section-header h2 { 
      font-size: 0.9rem; 
      text-transform: uppercase; 
      letter-spacing: 0.1em; 
      color: var(--fg-muted); 
      margin: 0; 
    }
    .section-divider { flex: 1; height: 1px; background: var(--border); }

    .chapter-track { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
      gap: 1.5rem; 
      margin-bottom: 4rem; 
    }

    .chapter-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 2rem;
      border-radius: 12px;
      transition: border-color 0.3s ease, transform 0.3s ease;
    }
    .chapter-card:hover { 
      border-color: var(--fg-muted); 
      transform: translateY(-4px); 
    }

    .chapter-num { 
      font-size: 0.8rem; 
      color: var(--fg-muted); 
      margin-bottom: 1rem; 
      display: block;
    }
    .chapter-card h3 { 
      font-size: 1.5rem; 
      font-weight: 600; 
      margin: 0 0 1rem; 
    }
    .chapter-card ul { 
      margin: 0 0 1.5rem; 
      padding-left: 1.25rem; 
      color: var(--fg-muted);
      font-size: 0.95rem;
    }
    .chapter-card ul li { margin-bottom: 0.5rem; }
    .chapter-link { 
      font-weight: 600; 
      font-size: 0.9rem;
      color: var(--fg);
    }
    .chapter-cover {
      position: absolute;
      inset: 0;
      cursor: pointer;
    }
  </style>
